<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f7fbff" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' http://127.0.0.1:8787 http://localhost:8787; style-src 'self'; script-src 'self'; img-src 'self' data:; base-uri 'none'; frame-ancestors 'none'; form-action 'none'"
    />
    <title>Codex Web</title>
    <meta name="description" content="このMacのCodexへプロンプトを送るシンプルな画面" />
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="connection" aria-live="polite">
          <span class="status-dot" id="status-dot"></span>
          <span id="status-label">Macを確認中</span>
          <span class="workspace-name" id="workspace-name"></span>
        </div>
        <div class="top-actions">
          <a class="local-link" id="local-link" href="http://127.0.0.1:8787">Macで開く</a>
          <button class="text-button" id="new-thread" type="button">新しい会話</button>
        </div>
      </header>

      <main class="conversation" id="conversation">
        <section class="empty-state" id="empty-state">
          <h1>何をしますか？</h1>
        </section>
      </main>

      <footer class="composer-wrap">
        <form class="composer" id="composer">
          <label class="sr-only" for="prompt">Codexへのプロンプト</label>
          <textarea
            id="prompt"
            name="prompt"
            rows="1"
            maxlength="12000"
            placeholder="Codexにやってほしいことを入力"
            autocomplete="off"
            disabled
          ></textarea>
          <button class="send-button" id="send-button" type="submit" disabled>送信</button>
        </form>
        <p class="hint" id="hint">このMacのCodexに接続します</p>
      </footer>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
